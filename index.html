<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome on Chess Pool</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at center, #0B192C 0%, #000000 100%);
      color: #fff;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    /* Top Bar Elements */
    .top-bar {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }

    /* Profile Card */
    .profile-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 16px;
      border-radius: 30px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .profile-card:hover {
      border-color: #38bdf8;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
    }
    .profile-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.1rem;
      border: 2px solid #fff;
    }
    .profile-name { font-size: 0.95rem; font-weight: 600; color: #f8fafc; }
    .edit-icon { font-size: 0.8rem; color: #94a3b8; margin-left: 4px; }

    /* Main Header Title */
    .header-title {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 2rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 3px;
      background: linear-gradient(180deg, #FFFFFF 0%, #94A3B8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }

    /* Controls & Round Timer */
    .top-right-controls {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .audio-btn {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }
    .audio-btn:hover { background: rgba(56, 189, 248, 0.2); border-color: #38bdf8; }

    .round-timer {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.9);
      border: 3px solid #38bdf8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
      backdrop-filter: blur(8px);
    }
    .timer-label { font-size: 0.6rem; color: #94a3b8; text-transform: uppercase; }
    .timer-count { font-size: 1.1rem; font-weight: 700; font-family: monospace; color: #38bdf8; }

    /* Exit Button (Visible during gameplay) */
    #exit-btn {
      display: none;
      position: absolute;
      bottom: 25px;
      right: 25px;
      z-index: 50;
      background: linear-gradient(135deg, #ef4444, #991b1b);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 12px 24px;
      border-radius: 25px;
      color: #fff;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
      transition: all 0.3s ease;
    }
    #exit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.7);
      background: linear-gradient(135deg, #dc2626, #7f1d1d);
    }

    /* Central Overlay Menu */
    #menu-overlay {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      z-index: 30;
    }

    .btn {
      width: 220px;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #fff;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      transition: all 0.3s ease;
      text-align: center;
    }
    .btn:hover {
      transform: translateY(-2px);
      border-color: #38bdf8;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
      background: linear-gradient(135deg, #0284c7, #0369a1);
    }
    .btn-secondary { background: rgba(30, 41, 59, 0.6); }

    .sub-menu {
      display: none;
      flex-direction: column;
      gap: 10px;
      animation: fadeIn 0.3s ease-in-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Modals */
    .modal {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #38bdf8;
      padding: 30px;
      border-radius: 20px;
      z-index: 100;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
      flex-direction: column;
      gap: 15px;
      width: 320px;
    }
    .modal h3 { color: #38bdf8; text-align: center; }
    .modal input {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      background: #0f172a;
      color: #fff;
      outline: none;
    }

    #canvas-container { width: 100vw; height: 100vh; position: absolute; top:0; left:0; z-index: 1; }
  </style>

  <!-- Libraries: Three.js, OrbitControls, Chess.js, PeerJS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <!-- Top Bar UI -->
  <div class="top-bar">
    <div class="profile-card" onclick="openProfileModal()">
      <div class="profile-avatar" id="avatar-char">P</div>
      <span class="profile-name" id="display-name">Player 1</span>
      <span class="edit-icon">✏️</span>
    </div>

    <div class="header-title">Big Welcome on Chess Pool</div>

    <div class="top-right-controls">
      <button class="audio-btn" id="audio-toggle" onclick="toggleAudio()">🎵</button>
      <div class="round-timer">
        <span class="timer-label">Time</span>
        <span class="timer-count" id="timer-val">03:00</span>
      </div>
    </div>
  </div>

  <!-- Exit Game Button -->
  <button id="exit-btn" onclick="exitToMainMenu()">Exit to Menu</button>

  <!-- Landing & Navigation Menu -->
  <div id="menu-overlay">
    <div id="main-buttons" style="display: flex; flex-direction: column; gap: 12px;">
      <button class="btn" onclick="showNewMatchOptions()">New Match</button>
      <button class="btn btn-secondary" id="continue-btn" onclick="continueMatch()">Continue</button>
    </div>

    <div class="sub-menu" id="new-match-options">
      <button class="btn" onclick="startVsComputer()">1. With Computer</button>
      <button class="btn" onclick="inviteFriend()">2. Invite Your Friend</button>
      <button class="btn btn-secondary" onclick="hideSubMenu()" style="width: auto; padding: 8px 16px; align-self: center; font-size: 0.8rem;">Back</button>
    </div>
  </div>

  <!-- Profile Edit Modal -->
  <div class="modal" id="profile-modal">
    <h3>Edit Profile</h3>
    <input type="text" id="username-input" placeholder="Enter your name" maxlength="15">
    <button class="btn" onclick="saveProfile()" style="width: 100%;">Save</button>
  </div>

  <!-- Share Link Modal -->
  <div class="modal" id="share-modal">
    <h3>Invite Friend</h3>
    <p style="font-size: 0.85rem; color: #94a3b8; text-align: center;">Share this link with your friend to play together live:</p>
    <input type="text" id="share-url" readonly>
    <button class="btn" onclick="copyInviteLink()" style="width: 100%;">Copy Link</button>
    <button class="btn btn-secondary" onclick="closeShareModal()" style="width: 100%;">Close</button>
  </div>

  <div id="canvas-container"></div>

<script>
  let game = new Chess();
  let vsAI = false;
  let isMultiplayer = false;
  let peer = null;
  let conn = null;
  let myColor = 'w';
  let gameStarted = false;
  let isGlobeMode = true;

  // Audio Context
  let audioCtx = null;
  let isMuted = true;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }

  function toggleAudio() {
    initAudio();
    isMuted = !isMuted;
    document.getElementById('audio-toggle').innerText = isMuted ? '🔇' : '🎵';
  }

  // Timer Management
  let timeLeft = 180;
  let timerInterval = null;

  function resetTimer() {
    clearInterval(timerInterval);
    timeLeft = 180;
    updateTimerUI();
    if (gameStarted) {
      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerUI();
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          alert("Time's up!");
        }
      }, 1000);
    }
  }

  function updateTimerUI() {
    const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
    const s = (timeLeft % 60).toString().padStart(2, '0');
    document.getElementById('timer-val').innerText = `${m}:${s}`;
  }

  // Profile Management
  function openProfileModal() {
    document.getElementById('profile-modal').style.display = 'flex';
  }
  function saveProfile() {
    const val = document.getElementById('username-input').value.trim();
    if (val) {
      document.getElementById('display-name').innerText = val;
      document.getElementById('avatar-char').innerText = val.charAt(0).toUpperCase();
      localStorage.setItem('chess_username', val);
    }
    document.getElementById('profile-modal').style.display = 'none';
  }

  // Three.js Setup
  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000000);

  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 0, 22);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  container.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;

  // Lighting - Studio Lighting for High Realism
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
  scene.add(ambientLight);

  const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.2);
  dirLight1.position.set(20, 25, 20);
  dirLight1.castShadow = true;
  dirLight1.shadow.mapSize.width = 2048;
  dirLight1.shadow.mapSize.height = 2048;
  scene.add(dirLight1);

  const dirLight2 = new THREE.DirectionalLight(0x38bdf8, 0.5);
  dirLight2.position.set(-20, -15, -20);
  scene.add(dirLight2);

  // High-Contrast Clear Materials
  const whitePieceMat = new THREE.MeshStandardMaterial({
    color: 0xffffff,
    roughness: 0.1,
    metalness: 0.1,
    emissive: 0x111111
  });

  const blackPieceMat = new THREE.MeshStandardMaterial({
    color: 0x0d0d0d,
    roughness: 0.2,
    metalness: 0.8
  });

  const whiteSquareMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2, metalness: 0.1 });
  const blackSquareMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.3, metalness: 0.3 });
  const highlightMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, roughness: 0.2, emissive: 0x0284c7 });

  // 3D Globe Group
  const globeGroup = new THREE.Group();
  scene.add(globeGroup);

  function createChessGlobe() {
    const sphereRadius = 6;
    const sphereGeom = new THREE.SphereGeometry(sphereRadius, 32, 32);
    
    const canvas = document.createElement('canvas');
    canvas.width = 512; canvas.height = 256;
    const ctx = canvas.getContext('2d');
    const cols = 16, rows = 8;
    const sw = canvas.width / cols, sh = canvas.height / rows;
    for(let r=0; r<rows; r++) {
      for(let c=0; c<cols; c++) {
        ctx.fillStyle = (r + c) % 2 === 0 ? '#ffffff' : '#111111';
        ctx.fillRect(c*sw, r*sh, sw, sh);
      }
    }
    const texture = new THREE.CanvasTexture(canvas);
    const globeMat = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.3, metalness: 0.2 });
    const globeMesh = new THREE.Mesh(sphereGeom, globeMat);
    globeGroup.add(globeMesh);

    const piecePositions = [
      { type: 'k', lat: 30, lon: 45, col: 'b' },
      { type: 'q', lat: 20, lon: 90, col: 'b' },
      { type: 'n', lat: -40, lon: 120, col: 'b' },
      { type: 'p', lat: 50, lon: -60, col: 'w' },
      { type: 'r', lat: -30, lon: -120, col: 'w' }
    ];

    piecePositions.forEach(p => {
      const mesh = createPieceMesh(p.type, p.col);
      const phi = (90 - p.lat) * (Math.PI / 180);
      const theta = (p.lon + 180) * (Math.PI / 180);

      mesh.position.x = -(sphereRadius + 0.2) * Math.sin(phi) * Math.cos(theta);
      mesh.position.y = (sphereRadius + 0.2) * Math.cos(phi);
      mesh.position.z = (sphereRadius + 0.2) * Math.sin(phi) * Math.sin(theta);

      mesh.lookAt(0,0,0);
      mesh.rotateX(Math.PI / 2);
      globeGroup.add(mesh);
    });
  }

  // 3D Flat Board Group
  const boardGroup = new THREE.Group();
  const tiles = {};
  const pieceMeshes = {};

  function createFlatBoard() {
    const TILE_SIZE = 1.8;
    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        const isWhite = (r + c) % 2 === 0;
        const geom = new THREE.BoxGeometry(TILE_SIZE, 0.3, TILE_SIZE);
        const mat = isWhite ? whiteSquareMat : blackSquareMat;
        const tile = new THREE.Mesh(geom, mat);
        tile.position.set((c - 3.5) * TILE_SIZE, -0.15, (3.5 - r) * TILE_SIZE);
        
        const squareName = String.fromCharCode(97 + c) + (8 - r);
        tile.userData = { square: squareName, defaultMat: mat };
        boardGroup.add(tile);
        tiles[squareName] = tile;
      }
    }
  }

  // Detailed Realistic Piece Geometries
  function createPieceMesh(type, color) {
    const group = new THREE.Group();
    const mat = color === 'w' ? whitePieceMat : blackPieceMat;

    const base = new THREE.Mesh(new THREE.CylinderGeometry(0.65, 0.72, 0.25, 32), mat);
    base.position.y = 0.125;
    group.add(base);

    if (type === 'p') {
      const body = new THREE.Mesh(new THREE.ConeGeometry(0.4, 0.85, 32), mat);
      body.position.y = 0.65;
      const top = new THREE.Mesh(new THREE.SphereGeometry(0.28, 16, 16), mat);
      top.position.y = 1.15;
      group.add(body, top);
    } else if (type === 'r') {
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.55, 1.0, 32), mat);
      body.position.y = 0.75;
      group.add(body);
    } else if (type === 'n') {
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.0, 0.65), mat);
      body.position.y = 0.75;
      group.add(body);
    } else if (type === 'b') {
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.5, 1.2, 32), mat);
      body.position.y = 0.85;
      const top = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 16), mat);
      top.position.y = 1.5;
      group.add(body, top);
    } else if (type === 'q') {
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.55, 1.4, 32), mat);
      body.position.y = 0.95;
      const crown = new THREE.Mesh(new THREE.SphereGeometry(0.32, 16, 16), mat);
      crown.position.y = 1.7;
      group.add(body, crown);
    } else if (type === 'k') {
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.6, 1.5, 32), mat);
      body.position.y = 1.0;
      const crossHorizontal = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.12, 0.12), mat);
      crossHorizontal.position.y = 1.85;
      const crossVertical = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.45, 0.12), mat);
      crossVertical.position.y = 1.85;
      group.add(body, crossHorizontal, crossVertical);
    }

    group.traverse(child => { if(child.isMesh) child.castShadow = true; });
    return group;
  }

  function renderFlatBoardPieces() {
    Object.values(pieceMeshes).forEach(m => boardGroup.remove(m));
    const boardState = game.board();

    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        const piece = boardState[r][c];
        if (piece) {
          const squareName = String.fromCharCode(97 + c) + (8 - r);
          const mesh = createPieceMesh(piece.type, piece.color);
          const tile = tiles[squareName];
          mesh.position.set(tile.position.x, 0, tile.position.z);
          boardGroup.add(mesh);
          pieceMeshes[squareName] = mesh;
        }
      }
    }
  }

  // Navigation Logic
  function showNewMatchOptions() {
    initAudio();
    document.getElementById('main-buttons').style.display = 'none';
    document.getElementById('new-match-options').style.display = 'flex';
  }
  function hideSubMenu() {
    document.getElementById('main-buttons').style.display = 'flex';
    document.getElementById('new-match-options').style.display = 'none';
  }

  function startFlatGame() {
    isGlobeMode = false;
    scene.remove(globeGroup);
    scene.add(boardGroup);
    game.reset();
    renderFlatBoardPieces();
    document.getElementById('menu-overlay').style.display = 'none';
    document.getElementById('exit-btn').style.display = 'block';
    gameStarted = true;
    resetTimer();
    saveGameState();
  }

  function exitToMainMenu() {
    isGlobeMode = true;
    gameStarted = false;
    clearInterval(timerInterval);
    scene.remove(boardGroup);
    scene.add(globeGroup);
    
    // Reset camera back to globe view
    camera.position.set(0, 0, 22);
    controls.target.set(0, 0, 0);

    document.getElementById('exit-btn').style.display = 'none';
    document.getElementById('menu-overlay').style.display = 'flex';
    hideSubMenu();
    document.getElementById('timer-val').innerText = "03:00";
  }

  function startVsComputer() {
    vsAI = true;
    isMultiplayer = false;
    myColor = 'w';
    camera.position.set(0, 16, 16);
    startFlatGame();
  }

  function inviteFriend() {
    vsAI = false;
    isMultiplayer = true;
    myColor = 'w';
    peer = new Peer();

    peer.on('open', (id) => {
      const shareUrl = `${window.location.origin}${window.location.pathname}?join=${id}`;
      document.getElementById('share-url').value = shareUrl;
      document.getElementById('share-modal').style.display = 'flex';
    });

    peer.on('connection', (c) => {
      conn = c;
      setupPeerEvents();
      document.getElementById('share-modal').style.display = 'none';
      startFlatGame();
    });
  }

  function checkJoinLink() {
    const params = new URLSearchParams(window.location.search);
    const joinId = params.get('join');
    if (joinId) {
      vsAI = false;
      isMultiplayer = true;
      myColor = 'b';
      peer = new Peer();

      peer.on('open', () => {
        conn = peer.connect(joinId);
        setupPeerEvents();
        camera.position.set(0, 16, -16);
        startFlatGame();
      });
    }
  }

  function setupPeerEvents() {
    conn.on('data', (data) => {
      if (data.type === 'move') {
        game.move(data.move);
        renderFlatBoardPieces();
        resetTimer();
        saveGameState();
      }
    });
  }

  function copyInviteLink() {
    const copyText = document.getElementById('share-url');
    copyText.select();
    navigator.clipboard.writeText(copyText.value);
    alert("Invite link copied to clipboard!");
  }
  function closeShareModal() {
    document.getElementById('share-modal').style.display = 'none';
  }

  function saveGameState() {
    localStorage.setItem('chess_saved_fen', game.fen());
  }
  function continueMatch() {
    const savedFen = localStorage.getItem('chess_saved_fen');
    if (savedFen) {
      game.load(savedFen);
      startFlatGame();
    } else {
      alert("No saved game found. Starting a new match!");
      showNewMatchOptions();
    }
  }

  // Interactive Raycasting for Moves
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  let selectedSquare = null;

  window.addEventListener('pointerdown', (e) => {
    if (isGlobeMode || !gameStarted) return;
    if (isMultiplayer && game.turn() !== myColor) return;
    if (vsAI && game.turn() === 'b') return;

    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(boardGroup.children);

    if (intersects.length > 0) {
      const tile = intersects[0].object;
      const square = tile.userData.square;

      if (selectedSquare) {
        const moveObj = { from: selectedSquare, to: square, promotion: 'q' };
        const move = game.move(moveObj);

        if (move) {
          renderFlatBoardPieces();
          clearHighlights();
          selectedSquare = null;
          resetTimer();
          saveGameState();

          if (isMultiplayer && conn) {
            conn.send({ type: 'move', move: moveObj });
          } else if (vsAI) {
            setTimeout(makeAIMove, 500);
          }
          return;
        }
      }

      const piece = game.get(square);
      if (piece && piece.color === game.turn()) {
        selectedSquare = square;
        clearHighlights();
        tile.material = highlightMat;

        const moves = game.moves({ square: square, verbose: true });
        moves.forEach(m => {
          if (tiles[m.to]) tiles[m.to].material = highlightMat;
        });
      } else {
        selectedSquare = null;
        clearHighlights();
      }
    }
  });

  function clearHighlights() {
    Object.values(tiles).forEach(t => t.material = t.userData.defaultMat);
  }

  function makeAIMove() {
    const moves = game.moves();
    if (moves.length > 0) {
      const randomMove = moves[Math.floor(Math.random() * moves.length)];
      game.move(randomMove);
      renderFlatBoardPieces();
      resetTimer();
      saveGameState();
    }
  }

  // Init
  createChessGlobe();
  createFlatBoard();

  const savedUser = localStorage.getItem('chess_username');
  if (savedUser) {
    document.getElementById('display-name').innerText = savedUser;
    document.getElementById('avatar-char').innerText = savedUser.charAt(0).toUpperCase();
  }

  checkJoinLink();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  function animate() {
    requestAnimationFrame(animate);

    if (isGlobeMode) {
      globeGroup.rotation.y += 0.005;
    }

    controls.update();
    renderer.render(scene, camera);
  }

  animate();
</script>
</body>
</html>
